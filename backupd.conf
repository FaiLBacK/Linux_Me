# Конфигурация демона backupd.
# Права: chown root:root /etc/backupd/backupd.conf && chmod 600 /etc/backupd/backupd.conf
# Изменения применяются без перезапуска: systemctl reload backupd (или backupctl reload).

[backup]
# Что копируем (абсолютный путь к существующему каталогу)
source = /srv/data

# Куда складываем копии. Каталог создаётся с правами 0700.
# Если меняете путь — обновите ReadWritePaths в backupd.service.
destination = /var/backups/backupd

# Как часто делать копию: число секунд или с суффиксом s/m/h/d/w (30m, 6h, 1d). Минимум 10 с.
interval = 6h

# archive — один сжатый архив <prefix>_ГГГГММДД_ЧЧММСС.tar.gz
# copy    — полная копия дерева в каталог <prefix>_ГГГГММДД_ЧЧММСС
mode = archive

# Начало имени копии (буквы, цифры, . _ -)
prefix = backup

# Сколько последних копий хранить; более старые удаляются. 0 — не удалять.
keep = 7

# Что не копировать: маски через запятую (сравниваются с именем и относительным путём)
exclude = *.tmp, *.swp, .cache, node_modules

# Проверять архив после создания (читается целиком, проверяется CRC)
verify = yes

# Степень сжатия gzip 1..9 (1 — быстрее и легче для CPU, 9 — компактнее)
compresslevel = 6

[daemon]
# Эти три параметра меняются только с перезапуском демона
pidfile = /run/backupd/backupd.pid
statusfile = /var/lib/backupd/status.json
# Приоритет процесса 0..19 (больше — «вежливее» к остальной системе)
nice = 10

# Уровень журнала: DEBUG, INFO, WARNING, ERROR
log_level = INFO
